[config]
reload_apps = true
set_wallpaper = false
[templates.waybar]
input_path = '~/.config/matugen/templates/waybar.css'
output_path = '~/.config/waybar/colors.css'
post_hook = 'pkill -SIGUSR2 waybar'
# [templates.kitty]
# input_path = '~/.config/matugen/templates/kitty.conf'
# output_path = '~/.config/kitty/themes/Matugen.conf'
# post_hook = 'kitty @ set-colors --all ~/.config/kitty/themes/Matugen.conf'
[templates.zen-chrome]
input_path = "~/.config/matugen/templates/zen.css"
output_path = "/home/dox/.cache/matugen/zen-matugen.css"
post_hook = "pkill -USR1 -x zen"
[templates.zen-content]
input_path = "~/.config/matugen/templates/zen-content.css"
output_path = "/home/dox/.cache/matugen/zen-content-matugen.css"
[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty'
output_path = '~/.config/ghostty/themes/matugen'
post_hook = 'pkill -SIGUSR2 ghostty'
[templates.neovim]
input_path = "~/.config/matugen/templates/neovim.vim"
output_path = "~/.config/nvim/matugen.vim"
post_hook = "pkill -USR1 -x nvim"
[templates.mango]
input_path = '~/.config/matugen/templates/mango.conf'
output_path = '~/.config/mango/matugen.conf'
# post_hook = "mmsg dispatch reload_config"
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk3.css'
output_path = '~/.config/gtk-3.0/colors.css'
[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk4.css'
output_path = '~/.config/gtk-4.0/colors.css'
[templates.qt5ct]
input_path = '~/.config/matugen/templates/qt5ct.conf'
output_path = '~/.config/qt5ct/colors/matugen.conf'
[templates.qt6ct]
input_path = '~/.config/matugen/templates/qt6ct.conf'
output_path = '~/.config/qt6ct/colors/matugen.conf'
[templates.rmpc]
input_path = '~/.config/matugen/templates/rmpc.ron'
output_path = '~/.config/rmpc/themes/matugen.ron'
[templates.qutebrowser]
input_path = "~/.config/matugen/templates/qutebrowser.py"
output_path = "~/.config/qutebrowser/matugen/colors.py"
[templates.yazi]
input_path = '~/.config/matugen/templates/yazi.toml'
output_path = '/home/dox/.config/yazi/flavors/matugen.yazi/flavor.toml'
[templates.swaylock]
input_path = '~/.config/matugen/templates/swaylock'
output_path = '~/.config/swaylock/config'
[templates.tmux]
input_path = '~/.config/matugen/templates/tmux.conf'
output_path = '~/.config/tmux/generated.conf'
post_hook = 'tmux source-file ~/.config/tmux/generated.conf'
[templates.veila]
input_path = '~/.config/matugen/templates/veila.toml'
output_path = '~/.cache/matugen/veila.toml'
[templates.btop]
input_path = '~/.config/matugen/templates/btop.conf'
output_path = '/home/dox/.config/btop/themes/matugen.theme'
[templates.foot]
input_path = '~/.config/matugen/templates/foot.ini'
output_path = '/home/dox/.config/foot/themes/matugen'
[templates.vesktop-material]
input_path = "~/.config/matugen/templates/vesktop-material.css"
output_path = "/home/dox/.config/vesktop/themes/matugen-material.css"
[templates.vesktop-midnight]
input_path = "~/.config/matugen/templates/vesktop-midnight.css"
output_path = "~/.config/vesktop/themes/matugen-midnight.css"
[templates.vesktop-system24]
input_path = "~/.config/matugen/templates/vesktop-system24.css"
output_path = "~/.config/vesktop/themes/vesktop-system24.css"
[templates.vicinae]
input_path = './templates/vicinae.toml'
output_path = '~/.local/share/vicinae/themes/matugen.toml'
post_hook = 'vicinae theme set matugen'
[templates.swaync]
input_path = '~/.config/matugen/templates/swaync.css'
output_path = '~/.config/swaync/styles/colors.css'
post_hook = 'swaync-client -rs'
