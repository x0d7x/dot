# Generated by Matugen

# Status bar
set -g status-bg "{{colors.surface.default.hex}}"
set -g status-fg "{{colors.on_surface.default.hex}}"

# Message colors
set -g message-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.on_surface.default.hex}}"
# set -g message-command-style "bg={{colors.surface_container_high.default.hex}},fg={{colors.primary.default.hex}}"

# Pane borders
set -g pane-border-style "fg={{colors.outline_variant.default.hex}}"
set -g pane-active-border-style "fg={{colors.primary.default.hex}}"

# Window status
set -g window-status-style "bg={{colors.surface.default.hex}},fg={{colors.on_surface_variant.default.hex}}"
set -g window-status-current-style "bg={{colors.primary_container.default.hex}},fg={{colors.on_primary_container.default.hex}}"

# Status segments
set -g status-left-style "fg={{colors.primary.default.hex}},bold"
set -g status-right-style "fg={{colors.on_surface_variant.default.hex}}"

# Modes and selection
set -g mode-style "bg={{colors.secondary_container.default.hex}},fg={{colors.on_secondary_container.default.hex}}"
