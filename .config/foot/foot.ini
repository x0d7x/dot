# -*- conf -*-
[bell]
system=yes
urgent=yes
notify=yes
# visual=no
# command=
# command-focused=no

[cursor]
style=block
blink=yes
blink-rate=500
# beam-thickness=1.5
# underline-thickness=<font underline thickness>

[mouse]
hide-when-typing=yes
# alternate-scroll-mode=yes

[colors-dark]
#this for opacity
alpha=0.90 
# alpha-mode=default # Can be `default`, `matching` or `all`


[main]
shell=/bin/zsh --login -c 'if command -v tmux >/dev/null 2>&1 && [ -z "$TMUX" ]; then tmux attach 2>/dev/null || tmux new-session -s Dev; else exec zsh; fi'
font=VictorMono Nerd Font Mono:size=14
# line-height=<font metrics>
# line-height=1.2
# dpi-aware=yes
# initial-window-mode=windowed
include=~/.config/foot/themes/matugen

# vim: ft=dosini
