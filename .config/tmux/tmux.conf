 # to support 256 colors and kitty protocol
# set -sg terminal-overrides ",*:RGB"
# set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-kitty:RGB:kitty"
set -g default-terminal "screen-256color"
# set -ag terminal-overrides ",xterm-256color:RGB"
set -g prefix C-a
unbind C-b
bind-key C-a send-prefix
unbind %
bind / split-window -h -l 50% -c "#{pane_current_path}"
unbind '"'
bind - split-window -v -l 20% -c "#{pane_current_path}"
bind Z setw synchronize-panes
unbind c
bind  c  new-window -c "#{pane_current_path}"
unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "config reloaded"
bind j resize-pane -D 5
bind k resize-pane -U 5
bind l resize-pane -R 5
bind h resize-pane -L 5
unbind x 
bind-key x kill-pane
unbind t
bind t set -g status
# make new session
bind-key S command-prompt -p "Enter session name:" "new-session -s '%%'"
unbind-key K
bind-key K kill-session -a # kill all sessions except current
# bind K confirm kill-session
bind -r m resize-pane -Z
bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
set -g mouse on
# Border lines between panes are thicker
# single -> single lines using ACS or UTF-8 characters
# double -> double lines using UTF-8 characters
# heavy  -> heavy lines using UTF-8 characters
# simple -> simple ASCII characters
# number -> the pane number
set -g pane-border-lines simple
# Indicate active pane by colouring only half of the border in windows with 
# exactly two panes, by displaying arrow markers, by drawing both or neither.
# [off | colour | arrows | both]
set -g pane-border-indicators both
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi 'v' send -X begin-selection # start selecting text with "v"
bind-key -T copy-mode-vi 'y' send -X copy-selection # copy text with "y"
unbind -T copy-mode-vi MouseDragEnd1Pane # don't exit copy mode when dragging with mouse
# --some options
set -g base-index 1              # start indexing windows at 1 instead of 0
set -g pane-base-index 1
set -g detach-on-destroy off     # don't exit from tmux when closing a session
set -g history-limit 1000000     # increase history size (from 2,000)
set -g renumber-windows on       # renumber all windows when any window is closed
set -g cursor-style blinking-block #set cursor-style
set -g set-clipboard on          # use system clipboard
set -g update-environment 'DISPLAY SSH_ASKPASS SSH_AGENT_PID SSH_AUTH_SOCK GPG_AGENT_INFO'
set -g allow-passthrough on
# style 
##### colors #####
set -g @yellow  "#ecba73"
set -g @blue    "#5e929b"
set -g @green   "#98971a"

##### status bar #####
set -g status-position top
set -g status-style bg=default
set -g status-left-length 100

set -g pane-active-border-style "fg=#{@yellow}"
set -g pane-border-style "fg=brightblack"

set -g status-left "#[fg=#{?client_prefix,#{@yellow},#{@blue}}]#{?client_prefix,󰳽,} #S | "
set -g status-right ""

##### windows #####
set -g window-status-format \
"#[fg=#{@blue}]#{?window_zoomed_flag, ,}#I:#W"

set -g window-status-current-format \
"#[fg=#{@yellow},bold]#{?window_zoomed_flag, , }#I:#W"

##### misc #####
set -g message-style "fg=#{@yellow}"
set -g window-status-bell-style "fg=red"
# remove delay for exiting insert mode with ESC in Neovim
set -sg escape-time 0
# tmux sessionizer
bind f display-popup -E "zsh -i -c tmux-sessionizer"
bind C-n run-shell "tmux neww ~/.config/scripts/notes.sh"
bind G run-shell "zsh -i -c github_open"
bind C-q display-popup -h 80% -w 80% -y 0 -E "btop"
bind q display-popup -w 80% -h 80% -E 'lazygit'
bind e display-popup -w 80% -h 80% -E 'rmpc'
bind C-g display-popup -w 80% -h 80% -E "zsh -ic opencode"
# tpm plugin
set -g @plugin 'tmux-plugins/tpm'
# list of tmux plugins
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect' # persist tmux sessions after computer restart
set -g @plugin 'tmux-plugins/tmux-continuum' # automatically saves sessions for you every 15 minutes
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'junegunn/tmux-fzf-url'
#NOTE:plugins Settings
set -g @continuum-restore 'on'
set -g @resurrect-strategy-nvim 'session'
set -g @fzf-url-fzf-options '--tmux center,40% --multi -0 --no-preview --border --style minimal'
# open tmux-fzf-url in a tmux v3.2+ popup
# I recommend using `o` if not already in use, for least key strokes when launching
# float
# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
