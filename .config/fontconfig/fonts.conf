<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<fontconfig>
  <!-- Override ugly Arial with proper Arabic fonts -->
  <alias>
    <family>Arial</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Naskh Arabic</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias>
    <family>sans-serif</family>
    <prefer>
      <family>Noto Sans</family>
      <family>Noto Naskh Arabic</family>
      <family>Noto Sans Arabic</family>
    </prefer>
  </alias>
  <alias>
    <family>serif</family>
    <prefer>
      <family>Noto Serif</family>
      <family>Noto Naskh Arabic</family>
      <family>Amiri</family>
    </prefer>
  </alias>
  <alias>
    <family>monospace</family>
    <prefer>
      <family>Noto Sans Mono</family>
      <family>Noto Naskh Arabic</family>
    </prefer>
  </alias>
  <!-- Thmanyah as Arabic fallback for the terminal fonts -->
  <alias>
    <family>IoskeleyMono Nerd Font</family>
    <prefer>
      <family>thmanyah sans</family>
    </prefer>
  </alias>
  <alias>
    <family>EnvyCodeR Nerd Font Mono</family>
    <prefer>
      <family>thmanyah sans</family>
    </prefer>
  </alias>
</fontconfig>
