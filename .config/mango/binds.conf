# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none

# reload config
bind=SUPER,r,reload_config
bind=Ctrl,space,switch_keyboard_layout,us,ara

# menu and terminal
bind=Super,t,spawn,kitty --app-id kitty-terminal

# exit
bind=Alt+Shift,e,quit
bind=ALT,q,killclient,

# switch window focus
# bind=Alt+Shift,Tab,focuslast
bind=ALT,h,focusdir,left
bind=ALT,l,focusdir,right
bind=ALT,k,focusdir,up
bind=ALT,j,focusdir,down
# bind=ALT,Tab,focuslast
# bind=ALT,Tab,exec,mango-history toggle
bind=ALT,Tab,view,-1

# swap window
bind=ALT+SHIFT,k,exchange_client,up
bind=ALT+SHIFT,j,exchange_client,down
bind=ALT+SHIFT,h,exchange_client,left
bind=ALT+SHIFT,l,exchange_client,right

# switch window status
bind=Alt,g,toggleglobal,
bind=ALT,o,togglejump,
bind=ALT,v,togglefloating,
bind=ALT,m,togglemaximizescreen,
bind=ALT,f,togglefullscreen,
bind=ALT+Shift,f,togglefakefullscreen,
bind=Alt,i,minimized,
bind=Alt+Shift,o,toggleoverlay,
bind=Alt+SHIFT,I,restore_minimized
bind=ALT,z,toggle_scratchpad

# scroller layout
bind=ALT,e,set_proportion,1.0
bind=ALT,r,switch_proportion_preset,

# switch layout
bind=Alt,n,switch_layout

# tag switch
bind=SUPER,Left,viewtoleft,0
bind=CTRL,Left,viewtoleft_have_client,0
bind=SUPER,Right,viewtoright,0
bind=CTRL,Right,viewtoright_have_client,0
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0

bind=Alt,t,view,1,0
bind=Alt,b,view,2,0
bind=Alt,d,view,3,0
bind=Alt,s,view,4,0
bind=Alt,5,view,5,0
bind=Alt,6,view,6,0
bind=Alt,7,view,7,0
# bind=Alt,8,view,8,0
# bind=Ctrl,9,view,9,0
# go to last view
# bind=ALT,Tab,view,-1,0
# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
bind=Alt+Shift,1,tag,1,0
bind=Alt+Shift,2,tag,2,0
bind=Alt+Shift,3,tag,3,0
bind=Alt+Shift,4,tag,4,0
bind=Alt+Shift,5,tag,5,0
bind=Alt+Shift,6,tag,6,0
bind=Alt+Shift,7,tag,7,0
# bind=Alt+Shift,8,tag,8,0
# bind=Alt,9,tag,9,0

# monitor switch
bind=alt+shift,Left,focusmon,left
bind=alt+shift,Right,focusmon,right
bind=SUPER+Alt,Left,tagmon,left
bind=SUPER+Alt,Right,tagmon,right

monitorrule=name:eDP-1,scale:1.75,refresh:60,height:1880,width:2880
# gaps
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# movewin
bind=CTRL+SHIFT,Up,movewin,+0,-50
bind=CTRL+SHIFT,Down,movewin,+0,+50
bind=CTRL+SHIFT,Left,movewin,-50,+0
bind=CTRL+SHIFT,Right,movewin,+50,+0

bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# resizewin
bind=CTRL+ALT+Shift,k,resizewin,+0,-50
bind=CTRL+ALT+Shift,j,resizewin,+0,+50
bind=CTRL+ALT++Shift,h,resizewin,-50,+0
bind=CTRL+ALT++Shift,l,resizewin,+50,+0

#gesture
gesturebind=none,left,3,viewtoleft_have_client
gesturebind=none,right,3,viewtoright_have_client
gesturebind=none,up,3,toggleoverview
gesturebind=none,down,3,toggleoverview
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview
gesturebind=none,down,4,toggleoverview


# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=NONE,btn_middle,togglemaximizescreen,0
mousebind=SUPER,btn_right,moveresize,curresize

# Axis Bindings
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client

# noctalia
bind=Alt,return,spawn,noctalia msg panel-toggle launcher
bind=Alt+Shift,W,spawn,noctalia msg panel-toggle wallpaper
bind=Super,v,spawn,noctalia msg panel-toggle x0d7x/clipmask:panel
bind=Super,e,spawn,noctalia msg panel-toggle launcher /emo
bind=Alt+Shift,P,spawn,noctalia msg panel-toggle session
bind=Super,s,spawn,noctalia msg settings-toggle

# screenshot
bind=Ctrl+Shift,1,spawn,screenshot.sh
bind=Ctrl+Shift,2,spawn,screenshot.sh area
bind=Ctrl+Shift,3,spawn,screenshot.sh edit
bind=Ctrl+Shift,4,spawn,screenshot.sh edit-full
# sounds
bind=NONE,XF86AudioRaiseVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%+ -l 1.0
bind=NONE,XF86AudioLowerVolume,spawn,wpctl set-volume @DEFAULT_SINK@ 5%-
bind=NONE,XF86AudioMute,spawn,wpctl set-mute @DEFAULT_SINK@ toggle

# apps
# bind=Super,a,setkeymode,apps
bind=Super,o,spawn,flatpak run com.obsproject.Studio
# keymode=apps
# bind=NONE,Escape,setkeymode,default
bind=Super,b,spawn,flatpak run app.zen_browser.zen
bind=Super,m,spawn,kitty --app-id kitty-rmpc -e rmpc
bind=Super,d,spawn,flatpak run dev.vencord.Vesktop
bind=Super,l,spawn,flatpak run org.localsend.localsend_app
bind=Super,f,toggle_named_scratchpad,kitty-yazi,none,kitty --app-id kitty-yazi -e yazi
bind=Super,w,spawn,kitty --app-id kitty-btop -e btop
# bind=Super,f,spawn,yazi
bind=Super+Shift,T,spawn,kitty --app-id kitty-scratch -o shell /bin/zsh
# bind=+Shift,T,toggle_named_scratchpad,none,kitty-scratch,kitty --app-id kitty-float -1 -o shell /bin/zsh
