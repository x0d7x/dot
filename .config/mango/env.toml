[env]
"QT_WAYLAND_DISABLE_WINDOWDECORATION" = "1"
"QT_SCALE_FACTOR" = "1.2"
# QT_AUTO_SCREEN_SCALE_FACTOR = "1.1"

"GDK_BACKEND" = "wayland,x11,*"
# GTK_CSD = "0"
# GDK_SCALE = "1"
# CHROME_high_dpi_support = "1.2"
# CHROME-FORCE-DEVICE-SCALE-FACTOR = "1.2"

# Zen and GTK apps
"GDK_DPI_SCALE" = "1.2"

"QT_QPA_PLATFORM" = "wayland"
"QT_QPA_PLATFORMTHEME" = "qt6ct"

# Electron / Chromium apps
"OZONE_PLATFORM" = "wayland"
# HELIUM_USER_FLAGS = "--force-device-scale-factor=1.25"

"ELECTRON_OZONE_PLATFORM_HINT" = "wayland"
"ELECTRON_FORCE_DEVICE_SCALE_FACTOR" = "1.2"
# ELECTRON_OZONE_PLATFORM_HINT = "x11"

"MOZ_ENABLE_WAYLAND" = "1"
"SDL_VIDEO_DRIVER" = "wayland"

"_JAVA_AWT_WM_NONREPARENTING" = "1"
"WLR_RENDERER" = "vulkan"
