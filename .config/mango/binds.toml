# MangoWM key bindings
# https://mangowm.github.io/docs/configuration/toml/

#vars
[var]
mod = "Alt"
term = "ghostty"

# =========================
# Default key bindings
# =========================

[bind.default]

# Reload config
"SUPER+r" = "reload_config"
"Ctrl+space" = "switch_keyboard_layout,us,ara"

# Terminal
"Super+t" = "spawn,$term"

# Exit
"$mod+Shift+e" = "quit"
"$mod+q" = "killclient,"

# Switch window focus
# "$mod+Shift+Tab" = "focuslast"
"$mod+h" = "focusdir,left"
"$mod+l" = "focusdir,right"
"$mod+k" = "focus_window_or_workspace,up"
"$mod+j" = "focus_window_or_workspace,down"

# to make window grouped 
# refr to doc: https://mangowm.github.io/docs/bindings/keys#group
# Window grouping
# "$mod+Shift+g" = "groupjoin,left"
# **groupfocus,prev/next** for moving focus in the window group 
# **groupleave** to leave the window group

# $mod+Tab: previous tag
# mango-history toggle
# "$mod+Tab" = "exec,mango-history toggle"
# "$mod+Shift+Tab" = "exec,mango-switcher"
# "SUPER+Tab" = "exec,mango-switcher"

# Direct previous tag
"$mod+Tab" = "view,-1"
"$mod+Shift+Tab" = "overcircle,next"

# Swap windows
"$mod+SHIFT+k" = "exchange_client,up"
"$mod+SHIFT+j" = "exchange_client,down"
"$mod+SHIFT+h" = "exchange_client,left"
"$mod+SHIFT+l" = "exchange_client,right"

# Window state
"$mod+g" = "toggleglobal,"
"$mod+o" = "togglejump,"
"$mod+v" = "togglefloating,"
"$mod+m" = "togglemaximizescreen,"
"$mod+f" = "togglefullscreen,"
"$mod+Shift+f" = "togglefakefullscreen,"
"$mod+i" = "minimized,"
"$mod+Shift+o" = "toggleoverlay,"
"$mod+SHIFT+I" = "restore_minimized,0"
"$mod+z" = "toggle_scratchpad"

# Scroller layout
"$mod+e" = "set_proportion,1.0"
"$mod+r" = "switch_proportion_preset,"

# Switch layout
"$mod+comma" = "switch_layout"

# Tag switching
# "SUPER+Left" = "viewtoleft,0"
# "CTRL+Left" = "viewtoleft_have_client,0"
# "SUPER+Right" = "viewtoright,0"
# "CTRL+Right" = "viewtoright_have_client,0"
# "CTRL+SUPER+Left" = "tagtoleft,0"
# "CTRL+SUPER+Right" = "tagtoright,0"

"$mod+t" = "view,1,0"
"$mod+b" = "view,2,0"
"$mod+d" = "view,3,0"
"$mod+s" = "view,4,0"
"$mod+code:10" = "focusmon,next"
# "$mod+code:11" = "focusmon,BenQ"
"$mod+2" = "view,5,0"

# Other tags
# "$mod+5" = "view,5,0"
# "$mod+6" = "view,6,0"
# "$mod+7" = "view,7,0"
# "$mod+8" = "view,8,0"
# "Ctrl+9" = "view,9,0"

# Previous view
# "$mod+Tab" = "view,-1,0"

# Move client to tag
# "$mod+1" = "tagsilent,1"

"$mod+Shift+t" = "tag,1,0"
"$mod+Shift+b" = "tag,2,0"
"$mod+Shift+d" = "tag,3,0"
"$mod+Shift+s" = "tag,4,0"
"$mod+Shift+1" = "tag,5,0"

# "$mod+Shift+6" = "tag,6,0"
# "$mod+Shift+7" = "tag,7,0"
# "$mod+Shift+8" = "tag,8,0"
# "$mod+9" = "tag,9,0"

# Monitor switching
"$mod+shift+Left" = "focusmon,left"
"$mod+shift+Right" = "focusmon,right"
"SUPER+$mod+Left" = "tagmon,left"
"SUPER+$mod+Right" = "tagmon,right"
"$mod+Shift+m" = "create_virtual_output"
# "$mod+Shift+d" = "destroy_all_virtual_output"

# Gaps
"$mod+SHIFT+X" = "incgaps,1"
"$mod+SHIFT+Z" = "incgaps,-1"
"$mod+SHIFT+R" = "togglegaps"

# Move windows
"CTRL+SHIFT+Up" = "movewin,+0,-50"
"CTRL+SHIFT+Down" = "movewin,+0,+50"
"CTRL+SHIFT+Left" = "movewin,-50,+0"
"CTRL+SHIFT+Right" = "movewin,+50,+0"

"Super+SHIFT+k" = "movewin,+0,-50"
"Super+SHIFT+j" = "movewin,+0,+50"
"Super+SHIFT+h" = "movewin,-50,+0"
"Super+SHIFT+l" = "movewin,+50,+0"

# Resize windows
"CTRL+$mod+Shift+k" = "resizewin,+0,-50"
"CTRL+$mod+Shift+j" = "resizewin,+0,+50"
"CTRL+$mod+Shift+h" = "resizewin,-50,+0"
"CTRL+$mod+Shift+l" = "resizewin,+50,+0"

# Noctalia / Vicinae
"$mod+return" = "spawn_shell,pgrep vicinae >/dev/null || { nohup vicinae server --open >/dev/null 2>&1 & }; vicinae toggle"
"$mod+Shift+W" = "spawn,matuwall"
"Super+v" = "spawn,vicinae cmd launch clipboard:history"
"Super+e" = "spawn,vicinae cmd launch core:search-emojis"
"$mod+Shift+P" = "spawn,~/.config/mango/scripts/power.sh"
"Super+s" = "spawn,swaync-client -t -sw"
"Ctrl+Shift+p" = "spawn,vicinae cmd launch power:lock"
"Super+c" = "spawn,~/.local/bin/idle-veila.sh"

# Screenshots
"Ctrl+Shift+1" = 'spawn_shell,grim -t ppm - | satty --filename - --fullscreen --copy-command wl-copy --output-filename "$HOME/Pictures/Screenshots/%Y-%m-%d_%H-%M-%S.png"'
"Ctrl+Shift+2" = "spawn_shell,grim -g \"$(slurp -b '#00000074' -c '#ff7b3aff' -s '#00000066' -w 3)\" -t ppm - | satty --filename - --fullscreen --copy-command wl-copy --output-filename \"$HOME/Pictures/Screenshots/%Y-%m-%d_%H-%M-%S.png\""

# "Ctrl+Shift+3" = "spawn,screenshot.sh edit"
# "Ctrl+Shift+4" = "spawn,screenshot.sh edit-full"

# Volume
"XF86AudioRaiseVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 5%+ -l 1.0"
"XF86AudioLowerVolume" = "spawn,wpctl set-volume @DEFAULT_SINK@ 5%-"
"XF86AudioMute" = "spawn,wpctl set-mute @DEFAULT_SINK@ toggle"

# Applications
# "Super+a" = "setkeymode,apps"
"Super+o" = "spawn,obs"
"Super+g" = "spawn,gimp"
"Super+Shift+r" = "spawn,bash -c 'if ! pgrep -x gsr-ui >/dev/null; then gsr-ui launch-daemon >/tmp/gsr-ui.log 2>&1 & sleep 1; fi; gsr-ui-cli toggle-record-window'"

# "NONE+Escape" = "setkeymode,default"

"Super+z" = "spawn,flatpak run app.zen_browser.zen"
"Super+q" = "spawn,qutebrowser"
"Super+b" = "spawn,helium-browser --force-device-scale-factor=1.25"

# "Super+Shift+b" = "spawn,helium-browser --force-device-scale-factor=1.25 --incognito"
# "Super+b" = "spawn,helium-browser"
# "Super+b" = "spawn,qutebrowser"
# "Super+Shift+t" = "spawn,kitten quick-access-terminal --detach"

"Super+d" = "spawn,vesktop --force-device-scale-factor=1.15"
"Super+l" = "spawn,flatpak run org.localsend.localsend_app"

# Named scratchpads
"Super+Shift+t" = 'toggle_named_scratchpad,foot.scratch,none,foot -a foot.scratch -e /bin/zsh -c "fastfetch; exec zsh"'
"Super+m" = "toggle_named_scratchpad,rmpc,none,foot -a rmpc -e rmpc"
"Super+f" = "toggle_named_scratchpad,yazi,none,foot -a yazi -e yazi"
"Super+w" = "toggle_named_scratchpad,btop,none,foot -a btop -e btop"

# "Super+f" = "spawn,kitty --app-id spf -e spf"
# "Super+k" = "spawn_shell,pkill -9 wshowkeys 2>/dev/null || wshowkeys -a bottom -b '#00000000' -F 'Thmanyah 28'"

"Super+k" = "spawn_shell,pkill -9 wiv 2>/dev/null || wiv.sh"
"Super+Shift+m" = "spawn_shell,pkill -9 wl-mirror 2>/dev/null || wl-mirror -F 0"
"Super+Shift+b" = "spawn,~/.config/mango/scripts/toggle_blur.sh"

# Toggle unfocused window opacity
# "Super+Ctrl+o" = "spawn,mango-opacity-toggle"

# "Super+f" = "spawn,yazi"
# "Shift+T" = "toggle_named_scratchpad,none,kitty-scratch,kitty --app-id kitty-float -1 -o shell /bin/zsh"

# Enter OBS key mode
"Super+1" = "setkeymode,obs"


# =========================
# OBS key mode
# =========================

[bind.obs]

"$mod+u" = "spawn,obs-scene uleft"
"$mod+d" = "spawn,obs-scene rdown"
"$mod+s" = 'spawn,obs-scene "start soon"'
"$mod+b" = "spawn,obs-scene brb"
"$mod+c" = "spawn,obs-scene cam"
"$mod+q" = "setkeymode,default"


# =========================
# Gestures
# =========================

[gesturebind.default]

"none+left+3" = "viewtoleft_have_client"
"none+right+3" = "viewtoright_have_client"
"none+up+3" = "toggleoverview"
"none+down+3" = "toggleoverview"

"none+left+4" = "viewtoleft_have_client"
"none+right+4" = "viewtoright_have_client"
"none+up+4" = "toggleoverview"
"none+down+4" = "toggleoverview"


# =========================
# Mouse buttons
# =========================

[mousebind.default]

"SUPER+btn_left" = "moveresize,curmove"
"NONE+btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"


# =========================
# Scroll wheel
# =========================

[axisbind.default]

"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"
