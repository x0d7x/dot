# More option see https://github.com/DreamMaoMao/mango/wiki/

# Window effect
blur=1
blur_layer=0
blur_optimized=1
blur_params_num_passes = 3
blur_params_radius = 3
# blur_params_noise = 0.12
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
# layer_animations=0

shadows = 1
layer_shadows = 0
shadow_only_floating = 1
shadows_size = 5
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadowscolor= 0x000000ff

border_radius=15
no_radius_when_single=1
# focused_opacity=0.9
unfocused_opacity=0.6

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
# Available types: slide, zoom, fade, none.
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=0
zoom_initial_ratio=0.4
zoom_end_ratio=0.8
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=500
animation_duration_open=300
animation_duration_tag=350
animation_duration_close=250
animation_duration_focus=0
animation_curve_open=0.46,1.0,0.29,1
animation_curve_move=0.46,1.0,0.29,1
animation_curve_tag=0.46,1.0,0.29,1
animation_curve_close=0.08,0.92,0,1
animation_curve_focus=0.46,1.0,0.29,1
animation_curve_opafadeout=0.5,0.5,0.5,0.5
animation_curve_opafadein=0.46,1.0,0.29,1


# Overview Setting
hotarea_size=10
enable_hotarea=0
hotarea_corner=0
ov_tab_mode=0
overviewgappi=15
overviewgappo=30

# Misc
no_border_when_single=0
axis_bind_apply_timeout=100
focus_on_activate=1
allow_lock_transparent=1
idleinhibit_ignore_visible=0
sloppyfocus=1
warpcursor=1
focus_cross_monitor=0
focus_cross_tag=0
enable_floating_snap=0
snap_distance=30
cursor_size=20
cursor_theme=Bibata-Modern-Amber
cursor_hide_on_keypress = 1
drag_tile_to_tile=1
drag_tile_small=1

# keyboard
repeat_rate=30
repeat_delay=250
numlockon=0
xkb_rules_layout=us,ara
xkb_rules_variant=,mac
# xkb_rules_options=grp:win_space_toggle

# Trackpad
# need relogin to make it apply
disable_trackpad=0
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=1
disable_while_typing=1
left_handed=0
scroll_method = 1
click_method = 2
middle_button_emulation=0
swipe_min_threshold=1
button_map = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling=1

# Appearance
gappih=15
gappiv=15
gappoh=20
gappov=20
scratchpad_width_ratio=0.8
scratchpad_height_ratio=0.9
borderpx=2
rootcolor=0x201b14ff
bordercolor=0x444444ff
dropcolor=0x8FBA7C55
focuscolor=0xc9b890ff
maximizescreencolor=0x89aa61ff
urgentcolor=0xad401fff
scratchpadcolor=0x516c93ff
globalcolor=0xb153a7ff
overlaycolor=0x14a57cff

# autostart scripts
exec-once=bash ~/.config/mango/autostart.sh
# binds 
source=./binds.conf
# env 
source=./env.conf
# noctalia theme
source=./noctalia.conf
# windows rules
source=./rules.conf
# layouts
source=./layouts.conf
