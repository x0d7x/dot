
# Monitor Rules
# [[rule.monitor_rule]]
# name = "eDP-1"
# scale = 1.75
# refresh = 60
# height = 1880
# width = 2880

[[rule.monitor_rule]]
model = "BenQ EW270Q"
vrr = 1 # Avoid tearing artifacts from the previous wallpaper

[[rule.monitor_rule]]
name = "0"
refresh = 200
height = 1440
width = 2560
x = 2560
y = 0 # Avoid tearing artifacts from the previous wallpaper


# Floating overlays: MPV and Restream Chat
[[rule.window_rule]]
is_floating = 1
app_id = "^(mpv|Restream Chat)$"
is_overlay = 1
is_global = 1
width = 700
height = 450
offset_x = 100
offset_y = -100
focused_opacity = 1
is_open_silent = 1
allow_csd = 0

# Picture-in-Picture
[[rule.window_rule]]
is_floating = 1
is_global = 1
is_overlay = 1
width = 700
height = 400
offset_x = 100
offset_y = -50
unfocused_opacity = 1
title = "^[Pp]icture[- ][Ii]n[- ][Pp]icture"
is_tag_silent = 1
is_open_silent = 1


# Browsers: Tag 2
[[rule.window_rule]]
force_fake_maximize = 1
tags = 2
app_id = "^(app\\.zen_browser\\.zen|org\\.qutebrowser\\.qutebrowser|helium)"
allow_csd = 0

