# Layer Rules

# Kitty quick access
[[rule.layer_rule]]
animation_type_open = "zoom"
animation_type_close = "zoom"
layer_name = "^kitty-quick-access"
no_shadow = 1
no_blur = 1

# [[rule.layer_rule]]
# no_animation = 1
# layer_name = "^(awww-daemon)$"
# no_shadow = 1
# no_blur = 1

# Noctalia backdrop (wallpaper): no blur, no shadow, no animation
[[rule.layer_rule]]
no_blur = 0
no_shadow = 0
no_animation = 1
layer_name = "^noctalia-backdrop$"

# Vicinae, Matuwall, Waybar
[[rule.layer_rule]]
animation_type_open = "slide"
animation_type_close = "fade"
no_blur = 1
no_shadow = 1
layer_name = "^(vicinae|matuwall|waybar)$"

# Noctalia bar: smooth appearance
[[rule.layer_rule]]
no_blur = 1
no_animation = 1
no_shadow = 1
layer_name = "^noctalia-(bar-[^\"]+|attached-panel|panel|notification|osd|dock)$"
