# monitorrule=name:eDP-1,scale:1.75,refresh:60,height:1880,width:2880
# monitorrule=name:DP-3,scale:1.20,refresh:200,height:1440,width:2560
windowrule=isfloating:1,appid:^(mpv),isoverlay:1,isglobal:1,width:650,height:400,offsetx:100,offsety:-100,unfocused_opacity:1,isopensilent:1
windowrule=isfloating:1,isglobal:1,isoverlay:1,offsety:100,width:200,height:100,appid:^(one\.alynx\.showmethekey)$,title:^Floating Window - Show Me The Key$
windowrule=isfloating:1,isglobal:1,isoverlay:1,width:580,height:320,offsetx:100,offsety:50,unfocused_opacity:1,title:^[Pp]icture[- ][Ii]n[- ][Pp]icture,istagsilent:1,isopensilent:1
windowrule=force_fakemaximize:1,tags:2,appid:^(app.zen_browser.zen|org.qutebrowser.qutebrowser),allow_csd:0
windowrule=force_fakemaximize:1,tags:3,appid:^(com\.obsproject\.Studio|com\.stremio\.Stremio|harbor|Recordly|vesktop|steam)$
windowrule=isfloating:1,noswallow:1,width:900,height:700,appid:^(yazi|btop|rmpc|scratch|spf)$
windowrule=isfloating:1,noswallow:1,width:900,height:700,appid:^com\.mitchellh\.ghostty\.(rmpc|yazi|btop|float)$
windowrule=isterm:1,appid:kitty,shield_when_capture:0
windowrule=force_fakemaximize:1,tags:1,appid:^com\.mitchellh\.ghostty$,isterm:1
windowrule=force_fakemaximize:1,tags:1,appid:kitty
windowrule=isfloating:1,width:500,height:600,appid:^(org.gnome.Nautilus|localsend)
layerrule=noshadow:1,layer_name:^kitty-quick-access                                                                                                                  
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^kitty-quick-access                                                                          

# Noctalia backdrop (wallpaper) — no blur, no shadow, no animation
layerrule=noblur:0,noshadow:1,noanim:1,layer_name:^noctalia-backdrop

# Noctalia bar — smooth appearance
layerrule=noblur:0,layer_name:^noctalia-bar

# Noctalia panels (launcher, settings, session) — zoom animation, no blur
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^noctalia-panel

# Noctalia notifications
layerrule=animation_type_open:slide,animation_type_close:slide,layer_name:^noctalia-notification

# Noctalia dock
# layerrule=noblur:0,layer_name:^noctalia-dock

# Noctalia OSD (volume/brightness popup)
layerrule=animation_type_open:zoom,animation_type_close:zoom,layer_name:^noctalia-osd
