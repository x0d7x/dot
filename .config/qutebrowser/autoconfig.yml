# If a config.py file exists, this file is ignored unless it's explicitly loaded
# via config.load_autoconfig(). For more information, see:
# https://github.com/qutebrowser/qutebrowser/blob/main/doc/help/configuring.asciidoc#loading-autoconfigyml
# DO NOT edit this file by hand, qutebrowser will overwrite it.
# Instead, create a config.py - see :help for details.

config_version: 2
settings:
  colors.webpage.darkmode.algorithm:
    global: lightness-cielab
  colors.webpage.darkmode.enabled:
    global: true
  content.blocking.method:
    global: both
  content.headers.user_agent:
    global: Mozilla/5.0 ({os_info}) AppleWebKit/{webkit_version} (KHTML, like Gecko)
      {upstream_browser_key}/{upstream_browser_version_short} Safari/{webkit_version}
    https://accounts.google.com/*: Mozilla/5.0 ({os_info}; rv:135.0) Gecko/20100101
      Firefox/135
  content.javascript.enabled:
    global: true
  editor.command:
    global:
    - nvim
    - -f
    - '{file}'
    - -c
    - normal {line}G{column0}l
  fonts.default_size:
    global: 13pt
  fonts.web.size.default:
    global: 17
  fonts.web.size.default_fixed:
    global: 15
  hints.scatter:
    global: true
  qt.chromium.low_end_device_mode:
    global: auto
  qt.highdpi:
    global: true
  scrolling.bar:
    global: overlay
  scrolling.smooth:
    global: true
  statusbar.show:
    global: always
  tabs.background:
    global: true
  tabs.indicator.width:
    global: 3
  tabs.pinned.frozen:
    global: false
  tabs.position:
    global: top
  tabs.select_on_remove:
    global: last-used
  tabs.show:
    global: multiple
  tabs.width:
    global: 15%
  window.hide_decoration:
    global: true
  window.transparent:
    global: true
  zoom.default:
    global: '112'
